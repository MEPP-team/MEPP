language: cpp

os:
  - linux
  - osx # default : Xcode 6.1b under Mavericks (OS X 10.9) -> NOW very too old !

sudo: required # need by trusty
dist: trusty

compiler:
  - clang
  - gcc

addons:
  apt:
    packages:
      - libboost-dev
      - libcgal-dev
      - libqt4-dev
      - libqglviewer-dev
      - libxerces-c-dev
      - libassimp-dev
      - doxygen
      - graphviz
  sonarqube:
    organization: ericboix-github
    token:
      secure: 10e96e51e8bdd717674a3f888b7d0ef74111694e

script:
  - build-wrapper-linux-x86-64 --out-dir bw-output make clean all
  - sonar-scanner

